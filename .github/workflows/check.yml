name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Build analysis data
        run: make data

      - name: Fit models
        run: make results

      - name: Unit, known-answer and simulation-recovery tests
        run: make test

      - name: Lint
        run: make lint

      - name: No typed numbers in report prose
        run: make numbers

      - name: Render the book
        run: make book
