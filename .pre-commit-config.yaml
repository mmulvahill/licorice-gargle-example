# Runs the project's checks before every commit.
# Install once: `pipx install pre-commit` (or `pip install pre-commit`),
# then `pre-commit install` in this repo.
repos:
  - repo: local
    hooks:
      - id: no-typed-numbers
        name: no typed numbers in report prose
        entry: Rscript scripts/check_inline_numbers.R
        language: system
        files: '\.qmd$'
        pass_filenames: false
      - id: lintr
        name: lintr
        entry: Rscript scripts/lint.R
        language: system
        files: '\.(R|qmd)$'
        pass_filenames: false
      - id: tests
        name: unit tests
        entry: Rscript -e 'testthat::test_local(stop_on_failure = TRUE)'
        language: system
        files: '^(R|tests)/.*\.R$'
        pass_filenames: false
      - id: raw-data-read-only
        name: raw data is read-only (new files are fine; edits are not)
        entry: >-
          bash -c 'changed=$(git diff --cached --name-only --diff-filter=MDR
          -- data/raw ":!data/raw/README.md");
          if [ -n "$changed" ]; then echo "Raw data may not be modified:";
          echo "$changed"; exit 1; fi'
        language: system
        files: '^data/raw/'
        pass_filenames: false
