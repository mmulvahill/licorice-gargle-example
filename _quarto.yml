project:
  type: book
  output-dir: _book

book:
  title: "Licorice Gargle Trial: Analysis Notebook and Report"
  author: "Matt Mulvahill"
  date: today
  repo-url: https://github.com/mmulvahill/licorice-gargle-example
  repo-actions: [source, issue]
  chapters:
    - index.qmd
    - part: "Plan"
      chapters:
        - chapters/01-question.qmd
        - chapters/02-data.qmd
        - chapters/03-methods.qmd
        - chapters/04-cautions.qmd
    - part: "Results"
      chapters:
        - chapters/05-describe.qmd
        - chapters/06-primary.qmd
    - part: "Record"
      chapters:
        - chapters/07-decisions.qmd
        - chapters/08-research-log.qmd
        - chapters/09-reproducibility.qmd

format:
  html:
    theme: cosmo
    code-fold: true
    code-summary: "Show code"
    toc: true

execute:
  echo: true
  warning: true
  message: false
  freeze: false
